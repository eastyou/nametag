[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nametag"
version = "0.1.0"
description = "姓名桌牌生成器：名单 CSV 生成 A4 折叠桌牌，前后两面镜像"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "nametag", "classroom", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
nametag = "nametag.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/nametag"
Source = "https://github.com/eastyou/nametag"

[tool.setuptools]
packages = ["nametag"]
