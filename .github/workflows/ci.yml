name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test name tag generation
        run: |
          python -m nametag -i examples/students.csv -o tags.html --columns 2 --rows 2
          python -c "print(open('tags.html', encoding='utf-8').read().count('class=' + chr(34) + 'card'))"
          python -c "print(open('tags.html', encoding='utf-8').read().count('rotate(180deg)'))"
